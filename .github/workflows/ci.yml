name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Type check (strict on v2 packages)
        run: python -m mypy

      - name: Test suite
        run: python -m pytest -q

      - name: Benchmark regression gate (legacy v1, all input modes)
        run: |
          for mode in context oracle oracle_no_question; do
            groundguard bench run --dataset gg-legacy-v1 --input-mode "$mode" --out "run.$mode.json"
            groundguard bench compare "benchmark/results/v0.1.0-baseline.$mode.json" "run.$mode.json" --fail-on-regression
          done

      - name: Benchmark regression gate (engine v2, all granularities)
        run: |
          for granularity in sentence clause conjunct; do
            groundguard bench run --dataset gg-legacy-v1 --input-mode context --engine v2 --granularity "$granularity" --out "run.v2.$granularity.json"
            groundguard bench compare "benchmark/results/v2-m2.$granularity.context.json" "run.v2.$granularity.json" --fail-on-regression
          done

      - name: Docker build
        run: docker build -t groundguard:ci .
