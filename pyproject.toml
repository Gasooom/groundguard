[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundguard"
version = "0.1.0"
description = "LLM reliability evaluation and hallucination detection system"
requires-python = ">=3.13,<3.14"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1"
]
dev = [
    "pytest>=9,<10",
    "mypy>=1.13,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1"
]

nli = [
    "transformers>=4.40",
    "torch>=2.2"
]

[project.scripts]
groundguard = "groundguard.cli:main"

[tool.setuptools.packages.find]
include = ["groundguard*"]

[tool.setuptools.package-data]
"groundguard.policy.builtin" = ["*.toml"]
"groundguard.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "groundguard/core",
    "groundguard/claims",
    "groundguard/evidence",
    "groundguard/verifiers",
    "groundguard/policy",
    "groundguard/checks",
    "groundguard/agents",
    "groundguard/calibration",
    "groundguard/pipeline.py",
    "groundguard/bench",
    "groundguard/cli.py",
    "groundguard/annotate.py",
    "groundguard/sdk",
    "groundguard/storage/v2_store.py",
    "groundguard/api/v2.py",
    "groundguard/api/app.py",
    "groundguard/api/security.py",
    "groundguard/api/settings.py",
]

# v0.1.0 modules are kept unchanged (ADR-004). They are type-checked with
# mypy's default rules rather than strict mode, to avoid churn in code whose
# behavior is pinned by the v1 baseline.
[[tool.mypy.overrides]]
module = [
    "groundguard.domain.*",
    "groundguard.application.*",
    "groundguard.evaluation.*",
    "groundguard.storage.*",
    "groundguard.api.v1",
    "groundguard.api.dashboard",
    "groundguard.api.schemas",
]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true
